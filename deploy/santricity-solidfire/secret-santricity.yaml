kind: Secret
apiVersion: v1
metadata:
  name:  santricity-secret
  namespace: default
type: Opaque
stringData:
  management_address: 192.168.1.34  # Array management addresses, E-Series / SANtricity Controller A or B
  username: admin                   # Array username
  # port_set: PortSet               # (Optional) Per-secret port set, for new ports only
                                    # Overrides global port-set config
                                    # SolidFire: probably not usable with SolidFire.
data:
  password: YWRtaW4=               # base64 array password, here "admin" for demo purposes
