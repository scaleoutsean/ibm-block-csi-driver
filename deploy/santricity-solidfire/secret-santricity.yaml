kind: Secret
apiVersion: v1
metadata:
  name:  santricity-secret
  namespace: default
type: Opaque
stringData:
  management_address: 192.168.1.34  # Array management addresses, E-Series / SANtricity Controller A or B
  username: storage                 # Array username; "storage" role/account should be enough
  verify_ssl: "false"               # (Optional) Enable/disable SSL certificate verification (False by default)
data:
  password: YWRtaW4=               # base64 array password, here "admin" for demo purposes; echo -n 'admin' | base64
